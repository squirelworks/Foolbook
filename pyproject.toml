[project]
name = "foolbook"
version = "1.0.8r2"
description = "Clean-room reader for ToolBook books"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "pillow",
    "openscript-analysis @ git+https://github.com/squirelworks/openscript_analysis.git@266d8358a646df5ad367e0acad19d888939ccc9f",
]

[project.urls]
Repository = "https://github.com/squirelworks/Foolbook"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolbook*", "engine*", "viewer*", "menu*", "progress*", "modules*", "toolbook*"]
