[project]
name = "foolbook"
version = "1.0.8r1"
description = "Clean-room reader for ToolBook books"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "pillow",
    "openscript-analysis @ git+https://github.com/squirelworks/openscript_analysis.git@4b8d77b30ab54960acc075f06109cdb80a9de035",
]

[project.urls]
Repository = "https://github.com/squirelworks/Foolbook"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolbook*", "engine*", "viewer*", "author*", "menu*", "progress*", "foolbookeditor*", "modules*"]

[tool.setuptools.package-data]
foolbook = ["books/*"]
